[package]
name = "pygame-rs"
version = "0.3.60"
edition = "2024"
description = "starfish 的 Python 绑定层：RustPython 内嵌壳 + pygame 绑定面（独立 crate，starfish 本体零 Python 资产）"

[features]
# ── 外接客人库开关（2026-10-24 feature 化；基座 + 维度细化）──
# gui：与维度无关的 UI 库开关。
# physics：基座（拉依赖 + 公共桥）；实际维度开 physics2d / physics3d
#   （可同时开——rapier crate 的 dim2/dim3 命名空间天然并存）。
#   只开 physics 不开维度 = 仅依赖图就位，Python 面无 rapier 模块。
# 缺省 2D 全开保持现状；--no-default-features 轻量构建下对应 Python
# 子模块随之消失（import 即 AttributeError）。
default = ["gui", "physics2d"]
gui = ["dep:egui-starfish-we", "dep:egui-wgpu"]
physics = ["dep:rapier-starfish-debug"]
physics2d = ["physics", "rapier-starfish-debug/2d"]
# 预留：3D 绑定面（pygame.rapier3d）随 3D 批次落地
physics3d = ["physics", "rapier-starfish-debug/3d"]

[dependencies]
starfish-std        = { path = "../starfish/crates/starfish-std", features = ["we"] }
starfish-we         = { path = "../starfish/crates/starfish-we" }
starfish-time       = { path = "../starfish/crates/starfish-time" }
starfish-permission = { path = "../starfish/crates/starfish-permission" }
starfish-io         = { path = "../starfish/crates/starfish-io" }
starfish-net        = { path = "../starfish/crates/starfish-net" }
starfish-dialog     = { path = "../starfish/crates/starfish-dialog" }
starfish-gamepad    = { path = "../starfish/crates/starfish-gamepad" }
starfish-render     = { path = "../starfish/crates/starfish-render" }
starfish-gfx        = { path = "../starfish/crates/starfish-gfx" }
starfish-font       = { path = "../starfish/crates/starfish-font" }
starfish-audio      = { path = "../starfish/crates/starfish-audio" }
starfish-video      = { path = "../starfish/crates/starfish-video" }
starfish-pygame     = { path = "../starfish/crates/starfish-pygame" }

# ── 外接客人库（原生风格绑定面，2026-10-24 批次 42；feature 门控，见 [features]）──
# rapier 物理适配层（2D v1；default 为空，features 必显式；wgpu 版本
# 契约 30.0.1 与 starfish-render 同源解析）
rapier-starfish-debug = { path = "../rapier-starfish-debug", features = ["2d"], optional = true }
# egui 适配层（vendored fork；feature "render" 拉 egui-wgpu + starfish-render
# 桥 SfEguiRenderer；egui 经它重导出，本 crate 不直依赖 egui）
egui-starfish-we = { path = "../egui-starfish-we", features = ["render"], optional = true }
# egui 绘制端（Renderer/ScreenDescriptor 类型面——egui-starfish-we 不重导出）
egui-wgpu = { version = "0.37.0", optional = true }
# wgpu 类型直依（渲染架构批次 C：ResourceAccess 包装层的内部桥接类型
# ——Buffer/BufferUsages/VertexFormat 等 Rust 侧使用；wgpu 裸对象
# 零出 Python 界的暴露面定约不变。版本与 starfish 同源合并单实例）
wgpu = { version = "30.0.1", default-features = false }



# math 绑定层的 glam 直绑（批次 K Vector3/Quaternion/Mat4；版本与 starfish
# 相同 semver → cargo 合并为同一实例，零重复）
glam = "0.33"
# dialog/io 同步绑定面的 block_on（批次 M；原生平台的 async API 本就是
# 阻塞实现体外壳——await 处即阻塞处，block_on 语义等价）
pollster = "0.4"
# Web 入口宏要求用户 crate 可见 wasm-bindgen（app_entry! 的 start 属性）
wasm-bindgen = "0.2.129"
# RustPython（vendor main 快照 0.6.0-dev，commit 23fcb8d9，2026-09-22）
# - default-features = false 去 host_env：wasm 必需（crt_fd 依赖不存在），
#   且 ctypes 恒不用（依赖双向规则的 C 能力替代 = 绑定面 Rust 原生函数）
# - freeze-stdlib：stdlib 冻结进二进制（无外部 Lib 依赖）
# - 三处 android 补丁见 src/rpy/dependencies/RustPython-main/（补丁①②③，
#   位置与缘由见 reference/rustpython改动备忘录.md）
rustpython-vm = { path = "src/rpy/dependencies/RustPython-main/crates/vm", default-features = false, features = [
    "compiler", "wasmbind", "gc", "stdio", "importlib", "encodings", "freeze-stdlib",
] }
rustpython-pylib = { path = "src/rpy/dependencies/RustPython-main/crates/pylib", features = ["freeze-stdlib"] }
# RP 派生宏直依赖（批次 B 原生模块树）：pyclass/pymethod/pyattr 等宏的
# 权威来源——vm 根 re-export 的 glob 因同名冲突只导出部分宏
rustpython-derive = { path = "src/rpy/dependencies/RustPython-main/crates/derive" }

[[example]]
name = "rp_hello"

[[example]]
name = "sig_probe"

[[example]]
name = "sig_probe_android"
path = "examples/sig_probe.rs"
crate-type = ["cdylib"]

# ── M1 绑定面探针：标准 pygame 写法（原生 pygame 模块 + with 会话渲染）──
[[example]]
name = "binding_probe"

[[example]]
name = "binding_probe_android"
path = "examples/binding_probe.rs"
crate-type = ["cdylib"]

# ── 逐模块独立测试案例迁移（2026-10-26 定约）：脚本形态归 pygame-rs-dev
# （python.exe examples/<名>.py 直跑）；APK 壳（*_android cdylib）随迁
# pygame-rs-dev/examples/——本仓 example 仅存 Rust 级 API 探针
#（rp_hello / sig_probe / binding_probe）